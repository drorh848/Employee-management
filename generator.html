<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔑 מחולל סיסמאות — ניהול זיהוי</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#12161C;color:#EAF0F7;font-family:'Heebo',sans-serif,Arial;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:420px;background:#1B222C;border:1px solid #2E3A48;border-radius:20px;padding:28px;text-align:center}
h1{font-size:20px;font-weight:900;margin-bottom:6px}
.sub{color:#8FA0B3;font-size:13px;margin-bottom:22px}
label{display:block;text-align:right;font-size:13px;color:#8FA0B3;margin:14px 0 6px}
.did{background:#12161C;border:1px dashed #FFB020;border-radius:10px;padding:14px;font-size:22px;font-weight:700;letter-spacing:3px;color:#FFB020;direction:ltr;min-height:54px}
.did:focus{outline:2px solid #FFB020}
button{width:100%;margin-top:18px;background:#FFB020;color:#1A1200;font-size:18px;font-weight:900;padding:14px;border:none;border-radius:12px;cursor:pointer;font-family:inherit}
.result{margin-top:18px;background:#12161C;border:1px solid #3DDC84;border-radius:10px;padding:16px;font-size:26px;font-weight:900;letter-spacing:2px;color:#3DDC84;direction:ltr;display:none;user-select:all}
.hint{color:#8FA0B3;font-size:12px;margin-top:10px}
.err{color:#FF5D5D;font-size:14px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="box">
  <h1>🔑 מחולל סיסמאות כנגד</h1>
  <div class="sub">ניהול זיהוי · קובץ זה נשאר רק אצלך — לא מעלים לאתר!</div>
  <label>הדבק את קוד המכשיר שהמנהל שלח:</label>
  <div class="did" id="did" contenteditable="true" spellcheck="false"></div>
  <button onclick="gen()">צור סיסמת פתיחה</button>
  <div class="result" id="res" onclick="copyRes()"></div>
  <div class="hint" id="hint"></div>
  <div class="err" id="err"></div>
</div>
<script>
const APP_NAME='ZihuyManager';
const MASTER_SECRET='ZHY#2026!srur*inspect';
const CHARSET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function sha256hex(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function gen(){
  const did=document.getElementById('did').textContent.trim().toUpperCase().replace(/[^A-F0-9]/g,'');
  document.getElementById('err').textContent='';
  if(did.length!==8){document.getElementById('err').textContent='קוד מכשיר לא תקין — צריך 8 תווים';return;}
  const hex=await sha256hex(did+MASTER_SECRET+APP_NAME);
  let out='';
  for(let i=0;i<12;i++){out+=CHARSET[parseInt(hex.substr(i*2,2),16)%CHARSET.length];}
  const lic=out.slice(0,4)+'-'+out.slice(4,8)+'-'+out.slice(8,12);
  const r=document.getElementById('res');
  r.textContent=lic;r.style.display='block';
  document.getElementById('hint').textContent='לחץ על הסיסמה להעתקה ושלח בוואטסאפ';
}
function copyRes(){
  const t=document.getElementById('res').textContent;
  navigator.clipboard.writeText(t).then(()=>{document.getElementById('hint').textContent='✔ הועתק!';});
}
</script>
</body>
</html>
